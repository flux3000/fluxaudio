<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flux Audio</title>
  <link rel="stylesheet" href="/css/main.css" />
  <!-- apply saved theme before first paint to avoid flash -->
  <script>if(localStorage.getItem('fluxTheme')==='light')document.body.classList.add('theme-light')</script>
</head>
<body>

  <!-- ── Login ──────────────────────────────────────────────────────────────── -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">FA</div>
        <span class="logo-text">Flux Audio</span>
      </div>
      <form id="login-form" class="login-form" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" autocomplete="off" spellcheck="false" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="off" />
        </div>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-submit">Sign in</button>
      </form>
    </div>
  </div>

  <!-- ── App shell ──────────────────────────────────────────────────────────── -->
  <div id="app-shell" class="app-shell hidden">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-mark">FA</div>
        <span class="logo-text">Flux Audio</span>
        <button class="theme-btn" id="theme-btn" title="Toggle light / dark">◑</button>
      </div>

      <div class="sidebar-nav" id="sidebar-nav"></div>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <span class="user-name" id="user-name">Loading...</span>
        </div>
        <button class="btn-icon" id="settings-btn" title="Settings">⚙</button>
        <button class="btn-icon" id="logout-btn" title="Sign out">⎋</button>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <div class="empty-state">
        <div class="empty-icon">◈</div>
        <div class="empty-title">Select an artist to browse recordings</div>
      </div>
    </main>

  </div>

  <!-- ── Player bar ─────────────────────────────────────────────────────────── -->
  <div class="player-bar" id="player-bar">
    <div class="player-track-info" id="player-info">
      <div class="player-track-title" id="player-title">—</div>
      <div class="player-track-meta" id="player-meta">No track selected</div>
      <div class="player-track-rec" id="player-rec"></div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="player-btn" id="btn-prev" title="Previous">
          <svg viewBox="0 0 18 14" fill="currentColor"><rect x="0" y="0" width="2.5" height="14"/><polygon points="18,0 5,7 18,14"/></svg>
        </button>
        <button class="player-btn player-btn-play" id="btn-play" title="Play / Pause">
          <svg class="icon-play" viewBox="0 0 12 14" fill="currentColor"><polygon points="0,0 12,7 0,14"/></svg>
          <svg class="icon-pause" viewBox="0 0 12 14" fill="currentColor" style="display:none"><rect x="0" y="0" width="4" height="14"/><rect x="8" y="0" width="4" height="14"/></svg>
        </button>
        <button class="player-btn" id="btn-next" title="Next">
          <svg viewBox="0 0 18 14" fill="currentColor"><polygon points="0,0 13,7 0,14"/><rect x="15.5" y="0" width="2.5" height="14"/></svg>
        </button>
      </div>
      <div class="player-progress">
        <span class="player-time" id="time-current">0:00</span>
        <input type="range" class="progress-bar" id="progress-bar" min="0" max="100" value="0" step="0.1" />
        <span class="player-time" id="time-duration">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <label class="skip-toggle" title="Skip announcements, banter &amp; tuning from playback queue">
        <input type="checkbox" class="skip-filter-cb" id="skip-filter-player" />
        <span class="skip-toggle-track"></span>
        <span class="skip-toggle-label">Skip non-music</span>
      </label>
      <span class="vol-sep"></span>
      <span class="vol-icon">&#128266;</span>
      <input type="range" class="volume-bar" id="volume-bar" min="0" max="1" value="0.8" step="0.01" />
    </div>
  </div>

  <audio id="audio-el" preload="none"></audio>

  <script src="/js/api.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/debug.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flux Debug</title>
  <style>
    :root {
      --bg:  #0c0f14;
      --bg1: #13181f;
      --bg2: #1a2028;
      --t0:  #e8ddd0;
      --t1:  #b8a898;
      --t2:  #7a6a5a;
      --red: #e05555;
      --grn: #6ab87a;
      --bd:  #2a3040;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t0);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg1);
      border-bottom: 1px solid var(--bd);
      flex-shrink: 0;
    }
    header span { color: var(--t2); font-size: 10px; flex: 1; }
    .pill {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--bd);
      background: var(--bg2);
      color: var(--t1);
    }
    .pill.active { color: var(--t0); border-color: var(--t2); }
    #content { flex: 1; overflow-y: auto; padding: 6px 0; }
    .row {
      display: flex;
      gap: 6px;
      align-items: baseline;
      padding: 3px 10px;
      border-bottom: 1px solid rgba(42,48,64,0.5);
      font-size: 10.5px;
      line-height: 1.5;
    }
    .row:hover { background: var(--bg1); }
    .row.err { background: rgba(224,85,85,0.06); }
    .method { min-width: 36px; color: var(--t2); font-size: 9px; text-transform: uppercase; }
    .status { min-width: 28px; }
    .status.ok  { color: var(--grn); }
    .status.bad { color: var(--red); }
    .url  { flex: 1; color: var(--t1); word-break: break-all; }
    .ms   { min-width: 44px; text-align: right; color: var(--t2); font-size: 9px; }
    .ts   { min-width: 60px; text-align: right; color: var(--t2); font-size: 9px; }
    .src  { color: var(--t2); font-size: 9px; min-width: 80px; }
    .msg  { flex: 1; color: var(--red); word-break: break-all; }
    .hint    { color: var(--t2); padding: 12px 10px; font-size: 10px; }
    .ok-msg  { color: var(--grn); padding: 12px 10px; font-size: 10px; }
    #status-bar {
      padding: 4px 12px;
      font-size: 9px;
      color: var(--t2);
      background: var(--bg1);
      border-top: 1px solid var(--bd);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #poll-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--t2);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #poll-dot.active { background: var(--grn); }
  </style>
</head>
<body>
  <header>
    <span>Flux Audio — Debug</span>
    <button class="pill active" id="tab-errors" onclick="setTab('errors')">JS Errors</button>
    <button class="pill"        id="tab-api"    onclick="setTab('api')">API Log</button>
    <button class="pill"                        onclick="clearView()">Clear view</button>
  </header>
  <div id="content"><div class="hint">Waiting for data from app…</div></div>
  <div id="status-bar">
    <div id="poll-dot"></div>
    <span id="status-text">connecting…</span>
  </div>

  <script>
    let allLog   = []   // full log from server
    let cleared  = { errors: 0, api: 0 }  // index of last clear per tab
    let tab      = 'errors'
    let errCount = 0

    const content    = document.getElementById('content')
    const statusText = document.getElementById('status-text')
    const pollDot    = document.getElementById('poll-dot')

    function setTab(t) {
      tab = t
      document.getElementById('tab-errors').classList.toggle('active', t === 'errors')
      document.getElementById('tab-api').classList.toggle('active', t === 'api')
      render()
    }

    function clearView() {
      // Remember current length so we hide everything before this point
      cleared[tab] = allLog.filter(e => kindFor(tab, e)).length
      render()
    }

    function kindFor(t, e) {
      return t === 'errors' ? e.kind === 'jserror' : e.kind === 'api'
    }

    function ts(iso) {
      try { return new Date(iso).toLocaleTimeString('en-US', { hour12: false }) }
      catch { return '?' }
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    function render() {
      const filtered = allLog.filter(e => kindFor(tab, e))
      const skip     = cleared[tab] || 0
      const visible  = filtered.slice(0, Math.max(0, filtered.length - skip))

      if (!visible.length) {
        content.innerHTML = tab === 'errors'
          ? '<div class="ok-msg">No JS errors ✓</div>'
          : '<div class="hint">No API calls yet</div>'
        return
      }

      if (tab === 'errors') {
        content.innerHTML = visible.map(e => `
          <div class="row err">
            <span class="method" style="color:var(--red)">ERR</span>
            <span class="msg">${esc(e.message)}</span>
            <span class="src">${esc(e.source)}</span>
            <span class="ts">${ts(e.ts)}</span>
          </div>`).join('')
      } else {
        content.innerHTML = visible.map(e => {
          const isErr     = e.status === 'ERR' || (typeof e.status === 'number' && e.status >= 400)
          const statusCls = isErr ? 'bad' : 'ok'
          return `<div class="row ${isErr ? 'err' : ''}">
            <span class="method">${esc(e.method)}</span>
            <span class="status ${statusCls}">${esc(e.status)}</span>
            <span class="url">${esc(e.url)}</span>
            <span class="ms">${e.ms ?? ''}ms</span>
            <span class="ts">${ts(e.ts)}</span>
          </div>`
        }).join('')
      }
    }

    // ── Polling ───────────────────────────────────────────────────────────────
    async function poll() {
      try {
        const r = await fetch('/api/debug/live', { credentials: 'include' })
        if (!r.ok) { statusText.textContent = `HTTP ${r.status}`; return }

        const data = await r.json()

        // Flash poll dot
        pollDot.classList.add('active')
        setTimeout(() => pollDot.classList.remove('active'), 150)

        // Check for new JS errors → auto-switch tab
        const newErrors = data.filter(e => e.kind === 'jserror').length
        if (newErrors > errCount) {
          errCount = newErrors
          setTab('errors')
        } else {
          errCount = newErrors
        }

        allLog = data
        render()
        statusText.textContent = `updated ${new Date().toLocaleTimeString()}`
      } catch (e) {
        statusText.textContent = 'poll error: ' + e.message
      }
    }

    poll()
    setInterval(poll, 1500)
  </script>
</body>
</html>
